# Windows compile check (PLAN.md S30, AG-70). Windows is deferred (S33), so it runs
# only by hand and is no longer a ticket gate (S31 had it run on every push). Only
# the public xbz123/margin runs it: in the private mirror the job is skipped, so it
# uses no private-repository minutes. It checks that the
# platform-branch code still builds on Windows x64 (type checks, renderer, Electron
# main process) and that the native module compiles with MSVC through the WASAPI
# branch. Since AG-71 it also runs the checks that need no audio device on that
# runner: the WASAPI loopback helper's unit tests, loading the built native module in
# Node, and the audio lifecycle and Windows isolation tests under the isolation guard
# (native audio is replaced by the guard's device double). Without package_apps it
# packages nothing; it uses no secrets and uploads only its logs and build record.
# Passing here is not a Windows 10/11 device test: nothing captures real audio.
#
# AG-73 package_apps (manual input): builds the unsigned x64 NSIS installer for the
# temp and release identities with scripts/build-local.cjs, checks each win-unpacked
# app (PE x64 natives, version strings, required files, notices), launches it in a
# throwaway profile and makes the corresponding-source bundle. Only reports,
# BUILD-INFO (with the installer's sha256) and the source bundle are uploaded; no
# installer is, since the Windows test identity is not decided. Nothing is signed,
# installed or uninstalled.
name: Windows compile

on:
  workflow_dispatch:
    inputs:
      package_apps:
        description: AG-73 temp and release x64 installers built and checked on the runner (reports only), their launch checks and the source bundle
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-compile:
    if: github.repository == 'xbz123/margin'
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.package_apps && 120 || 60 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26.0.0

      - name: Toolchain versions
        run: |
          node -v; npm -v
          # Same pinned Rust release as macOS; rustup adds the Windows host target itself.
          cd native-module && rustup toolchain install && rustc -V && cargo -V

      # .npmrc sets ignore-scripts=true, so this installs no Electron binary and runs
      # no dependency install scripts; none of the steps below need them.
      - run: npm ci

      - name: Type checks
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/windows-compile"
          node_modules/.bin/tsc --noEmit -p . 2>&1 | tee "$RUNNER_TEMP/windows-compile/tsc-renderer.log"
          node_modules/.bin/tsc -p electron/tsconfig.json --noEmit 2>&1 | tee "$RUNNER_TEMP/windows-compile/tsc-electron.log"

      - name: Build the Electron main process and the renderer
        run: |
          set -o pipefail
          node scripts/build-electron.js 2>&1 | tee "$RUNNER_TEMP/windows-compile/build-electron.log"
          node_modules/.bin/vite build 2>&1 | tee "$RUNNER_TEMP/windows-compile/vite-build.log"

      - name: Build the native module with MSVC
        run: |
          set -o pipefail
          node scripts/build-native.js 2>&1 | tee "$RUNNER_TEMP/windows-compile/build-native.log"

      - name: Native unit tests that need no device (WASAPI loopback helper, capture tail order)
        run: |
          set -o pipefail
          cd native-module
          for src in src/speaker/loopback.rs src/capture_tail.rs; do
            name=$(basename "$src" .rs)
            rustc --edition 2021 --test -D warnings "$src" -o "$RUNNER_TEMP/windows-compile/$name-tests.exe" 2>&1 | tee "$RUNNER_TEMP/windows-compile/$name-tests.log"
            "$RUNNER_TEMP/windows-compile/$name-tests.exe" 2>&1 | tee -a "$RUNNER_TEMP/windows-compile/$name-tests.log"
          done

      # Loads index.win32-x64-msvc.node in Node and runs the mock lifecycle tests. The
      # guard redirects USERPROFILE/APPDATA/TEMP into a sandbox and wraps the audio
      # module so no device is enumerated or opened. Loading the module is recorded as
      # a device stand-in, so that one file runs with --allow-blocked, as in the
      # guard-selftest gate step; every other test runs with any block failing it.
      - name: Native load, audio lifecycle, Windows UI logic and isolation tests
        run: |
          set -o pipefail
          node scripts/margin/isolation/run-node.mjs --allow-blocked --test \
            scripts/margin/isolation/__tests__/native-exports.node.test.mjs 2>&1 | tee "$RUNNER_TEMP/windows-compile/native-load.log"
          node scripts/margin/isolation/run-node.mjs --test \
            scripts/margin/isolation/__tests__/windows-isolation.node.test.mjs \
            'electron/audio/__tests__/*.test.mjs' \
            electron/utils/__tests__/validateImagePath.test.mjs \
            electron/services/__tests__/ImagePathValidation.test.mjs \
            electron/services/__tests__/ScreenshotDisplayCapture.test.mjs \
            electron/services/__tests__/WindowPreferences.test.mjs \
            electron/services/__tests__/WindowPreferencePersistence.test.mjs \
            electron/margin/__tests__/windowsPackage.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/windows-compile/node-tests.log"

      # AG-73. setup:native installs the Electron binary (node_modules/electron/install.js)
      # and rebuilds better-sqlite3 and keytar for Electron, as on macOS; its Info.plist
      # step finds no macOS Electron and does nothing.
      - name: Native setup for packaging
        if: ${{ !cancelled() && inputs.package_apps }}
        run: |
          set -o pipefail
          npm run setup:native 2>&1 | tee "$RUNNER_TEMP/windows-compile/setup-native.log"

      # The packaging steps run independently of each other's result (not after a
      # cancel) so one run reports every failing check; the job still fails.
      - name: Package the temp app (AG-73; reports only)
        if: ${{ !cancelled() && inputs.package_apps }}
        run: MARGIN_APP_VARIANT=temp node scripts/build-local.cjs

      - name: Package the release app (AG-73; reports only)
        if: ${{ !cancelled() && inputs.package_apps }}
        run: MARGIN_APP_VARIANT=release node scripts/build-local.cjs

      - name: Launch the packaged temp app in a throwaway profile (CI only)
        if: ${{ !cancelled() && inputs.package_apps }}
        run: node scripts/margin/packaged-launch.mjs "$RUNNER_TEMP/margin-package/temp/builder/win-unpacked" temp io.github.xbz123.temp "$RUNNER_TEMP/margin-package/temp/launch.json"

      - name: Launch the packaged release app in a throwaway profile (CI only)
        if: ${{ !cancelled() && inputs.package_apps }}
        run: node scripts/margin/packaged-launch.mjs "$RUNNER_TEMP/margin-package/release/builder/win-unpacked" Margin io.github.xbz123.margin "$RUNNER_TEMP/margin-package/release/launch.json"

      - name: Corresponding source bundle (S19-C, Windows x64 crates; workflow artifact)
        if: ${{ !cancelled() && inputs.package_apps }}
        run: node scripts/margin/source-bundle.mjs "$RUNNER_TEMP/margin-source"

      - name: Upload the package reports (no installer)
        if: ${{ always() && inputs.package_apps }}
        uses: actions/upload-artifact@v7
        with:
          name: margin-windows-package-reports-${{ github.sha }}
          path: |
            ${{ runner.temp }}/margin-package/*/*.json
            ${{ runner.temp }}/margin-package/*/*.log
            ${{ runner.temp }}/margin-package/*/BUILD-INFO.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload the source bundle
        if: ${{ !cancelled() && inputs.package_apps }}
        uses: actions/upload-artifact@v7
        with:
          name: margin-windows-source-${{ github.sha }}
          path: ${{ runner.temp }}/margin-source/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Record the build
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/windows-compile"
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "runner: $ImageOS $ImageVersion"
            echo "node: $(node -v)"
            echo "rustc: $(cd native-module && rustc -V)"
            if [ -f native-module/index.win32-x64-msvc.node ]; then
              sha256sum native-module/index.win32-x64-msvc.node
            else
              echo "native module: not built"
            fi
          } > "$RUNNER_TEMP/windows-compile/BUILD-INFO.txt"
          cat "$RUNNER_TEMP/windows-compile/BUILD-INFO.txt"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: margin-windows-compile-${{ github.sha }}
          path: ${{ runner.temp }}/windows-compile/
          retention-days: 30
