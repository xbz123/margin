# Windows compile check (PLAN.md S30, AG-70). Windows is deferred (S33), so it runs
# only by hand and is no longer a ticket gate (S31 had it run on every push). Only
# the public xbz123/margin runs it: in the private mirror the job is skipped, so it
# uses no private-repository minutes. It checks that the
# platform-branch code still builds on Windows x64 (type checks, renderer, Electron
# main process) and that the native module compiles with MSVC through the WASAPI
# branch. Since AG-71 it also runs the checks that need no audio device on that
# runner: the WASAPI loopback helper's unit tests, loading the built native module in
# Node, and the audio lifecycle and Windows isolation tests under the isolation guard
# (native audio is replaced by the guard's device double). It packages nothing, uses
# no secrets and uploads only its logs and build record. Passing here is not a
# Windows 10/11 device test: nothing captures real audio.
name: Windows compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-compile:
    if: github.repository == 'xbz123/margin'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26.0.0

      - name: Toolchain versions
        run: |
          node -v; npm -v
          # Same pinned Rust release as macOS; rustup adds the Windows host target itself.
          cd native-module && rustup toolchain install && rustc -V && cargo -V

      # .npmrc sets ignore-scripts=true, so this installs no Electron binary and runs
      # no dependency install scripts; none of the steps below need them.
      - run: npm ci

      - name: Type checks
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/windows-compile"
          node_modules/.bin/tsc --noEmit -p . 2>&1 | tee "$RUNNER_TEMP/windows-compile/tsc-renderer.log"
          node_modules/.bin/tsc -p electron/tsconfig.json --noEmit 2>&1 | tee "$RUNNER_TEMP/windows-compile/tsc-electron.log"

      - name: Build the Electron main process and the renderer
        run: |
          set -o pipefail
          node scripts/build-electron.js 2>&1 | tee "$RUNNER_TEMP/windows-compile/build-electron.log"
          node_modules/.bin/vite build 2>&1 | tee "$RUNNER_TEMP/windows-compile/vite-build.log"

      - name: Build the native module with MSVC
        run: |
          set -o pipefail
          node scripts/build-native.js 2>&1 | tee "$RUNNER_TEMP/windows-compile/build-native.log"

      - name: Native unit tests that need no device (WASAPI loopback helper, capture tail order)
        run: |
          set -o pipefail
          cd native-module
          for src in src/speaker/loopback.rs src/capture_tail.rs; do
            name=$(basename "$src" .rs)
            rustc --edition 2021 --test -D warnings "$src" -o "$RUNNER_TEMP/windows-compile/$name-tests.exe" 2>&1 | tee "$RUNNER_TEMP/windows-compile/$name-tests.log"
            "$RUNNER_TEMP/windows-compile/$name-tests.exe" 2>&1 | tee -a "$RUNNER_TEMP/windows-compile/$name-tests.log"
          done

      # Loads index.win32-x64-msvc.node in Node and runs the mock lifecycle tests. The
      # guard redirects USERPROFILE/APPDATA/TEMP into a sandbox and wraps the audio
      # module so no device is enumerated or opened. Loading the module is recorded as
      # a device stand-in, so that one file runs with --allow-blocked, as in the
      # guard-selftest gate step; every other test runs with any block failing it.
      - name: Native load, audio lifecycle and isolation tests
        run: |
          set -o pipefail
          node scripts/margin/isolation/run-node.mjs --allow-blocked --test \
            scripts/margin/isolation/__tests__/native-exports.node.test.mjs 2>&1 | tee "$RUNNER_TEMP/windows-compile/native-load.log"
          node scripts/margin/isolation/run-node.mjs --test \
            scripts/margin/isolation/__tests__/windows-isolation.node.test.mjs \
            'electron/audio/__tests__/*.test.mjs' 2>&1 | tee "$RUNNER_TEMP/windows-compile/node-tests.log"

      - name: Record the build
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/windows-compile"
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "runner: $ImageOS $ImageVersion"
            echo "node: $(node -v)"
            echo "rustc: $(cd native-module && rustc -V)"
            if [ -f native-module/index.win32-x64-msvc.node ]; then
              sha256sum native-module/index.win32-x64-msvc.node
            else
              echo "native module: not built"
            fi
          } > "$RUNNER_TEMP/windows-compile/BUILD-INFO.txt"
          cat "$RUNNER_TEMP/windows-compile/BUILD-INFO.txt"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: margin-windows-compile-${{ github.sha }}
          path: ${{ runner.temp }}/windows-compile/
          retention-days: 30
