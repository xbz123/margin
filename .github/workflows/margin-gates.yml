# Margin ticket gates on a clean macOS runner (PLAN.md §8, "CI 门禁").
# Runs only when a push to the migration branch says "[gates]" in its head commit
# message, or by hand. It reads the upstream repository (public, read-only) so the
# provenance check sees the same restricted pool as a local run, uses no secrets,
# and keeps the raw gate output as a run artifact. A green run is a reference for a
# clean install. With no_cache (manual runs only) it skips the Electron and cargo
# caches, so the native module is compiled from scratch; that run is the evidence for
# phase 1 exit item 1 under D5 (PLAN.md section 3). Every run also keeps the native
# module it built as a workflow artifact (except package_inventory diagnostics), which local development uses
# instead of the old cargo cache.
name: Margin gates

on:
  push:
    branches: [codex/margin-agpl-migration]
  workflow_dispatch:
    inputs:
      no_cache:
        description: Skip the Electron and cargo caches and build everything from scratch
        type: boolean
        default: false
      package_inventory:
        description: CI-only non-distributable temp app inventory; upload reports only
        type: boolean
        default: false
      gate_ref:
        description: Explicit gate reference directory (for example docs/margin/evidence/AG-26)
        type: string
        default: ''
      package_apps:
        description: AG-25 temp and release apps, launch checks and the S19-C source bundle (workflow artifacts only)
        type: boolean
        default: false
      libvips_rebuild:
        description: S21 libvips rebuild from the fixed recipe plus the replacement check (needs package_apps)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gates:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gates]')
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream refs and extra restricted commits (read-only)
        run: |
          # The empty extraheader keeps the checkout token from being sent to the upstream repository.
          git -c http.https://github.com/.extraheader= fetch --no-tags https://github.com/Natively-AI-assistant/natively-cluely-ai-assistant.git \
            '+refs/heads/*:refs/remotes/upstream/*'
          for sha in $(node -p "require('./docs/margin/provenance-config.json').restrictedExtraRefs.join(' ')"); do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
            git cat-file -e "$sha^{commit}"
          done
          echo "upstream refs: $(git for-each-ref refs/remotes/upstream --format=x | wc -l)"

      - uses: actions/setup-node@v7
        with:
          node-version: 26.0.0

      - name: Toolchain versions
        id: tools
        run: |
          node -v; npm -v; rustc -V; cargo -V; xcodebuild -version
          echo "rustc=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - if: ${{ !inputs.no_cache }}
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - if: ${{ !inputs.no_cache }}
        uses: actions/cache@v6
        with:
          path: native-module/target
          key: cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rustc }}-${{ hashFiles('native-module/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rustc }}-

      - run: npm ci

      - name: Native setup
        run: |
          set -o pipefail
          # Outside the checkout, so the gates see a clean tree.
          mkdir -p "$RUNNER_TEMP/native-artifact"
          npm run setup:native 2>&1 | tee "$RUNNER_TEMP/native-artifact/setup-native.log"

      - name: Collect the native module
        env:
          NO_CACHE: ${{ inputs.no_cache && 'true' || 'false' }}
        run: |
          cd "$RUNNER_TEMP"
          if [ "$NO_CACHE" = true ]; then
            # From scratch means cargo compiled cidre in this run.
            grep -E '^\s*Compiling cidre v' native-artifact/setup-native.log
          fi
          cp "$GITHUB_WORKSPACE/native-module/index.darwin-arm64.node" native-artifact/
          # Linker map of this link (native-module/.cargo/config.toml) and the linked set read from it.
          map=$(find "$GITHUB_WORKSPACE/native-module" -name natively-audio-aarch64-apple-darwin.map -newer "$GITHUB_WORKSPACE/package.json" | head -1)
          if [ -n "$map" ]; then
            cp "$map" native-artifact/
            node "$GITHUB_WORKSPACE/scripts/margin/native-link-set.mjs" native-artifact/natively-audio-aarch64-apple-darwin.map native-artifact/link-set.json
          fi
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "no_cache: $NO_CACHE"
            echo "rustc: $(rustc -V)"
            echo "xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "cidre compiled in this run: $(grep -cE '^\s*Compiling cidre v' native-artifact/setup-native.log || true)"
            shasum -a 256 native-artifact/index.darwin-arm64.node
            file native-artifact/index.darwin-arm64.node
            if [ -f native-artifact/link-set.json ]; then
              shasum -a 256 native-artifact/natively-audio-aarch64-apple-darwin.map native-artifact/link-set.json
            fi
          } > native-artifact/BUILD-INFO.txt
          cat native-artifact/BUILD-INFO.txt

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.package_inventory }}
        with:
          name: margin-native-${{ github.sha }}
          path: ${{ runner.temp }}/native-artifact/
          retention-days: 30

      - name: Run gates against the newest local ticket evidence
        env:
          GATE_REF: ${{ inputs.gate_ref }}
        run: |
          ref=$(node -e "
            const fs = require('fs');
            const explicit = process.env.GATE_REF;
            if (explicit) {
              if (!/^docs\/margin\/evidence\/AG-\d+$/.test(explicit) || !fs.existsSync(explicit + '/summary.json')) throw new Error('Invalid gate_ref');
              console.log(explicit);
              process.exit(0);
            }
            const dirs = fs.readdirSync('docs/margin/evidence').filter((d) => /^AG-\d+$/.test(d));
            dirs.sort((a, b) => Number(a.slice(3)) - Number(b.slice(3)));
            console.log('docs/margin/evidence/' + dirs.at(-1));
          ")
          echo "reference: $ref"
          node scripts/margin/run-gates.mjs --out ci-evidence --ref "$ref" \
            --note "GitHub Actions run ${{ github.run_id }} (attempt ${{ github.run_attempt }}) on macos-15, no_cache=${{ inputs.no_cache && 'true' || 'false' }}, compared with $ref"

      - name: Check release identity contract (CI only; no packaging)
        env:
          MARGIN_APP_VARIANT: release
        run: |
          set -o pipefail
          node scripts/build-electron.js 2>&1 | tee ci-evidence/identity-release-build.log
          node_modules/.bin/vite build 2>&1 | tee ci-evidence/identity-release-renderer.log
          node scripts/margin/isolation/run-node.mjs --test electron/margin/__tests__/appIdentity.test.mjs 2>&1 | tee ci-evidence/identity-release-contract.log

      # The packaging steps run independently of each other's result (not after a
      # cancel) so one run reports every failing check; the job still fails.
      - name: Package the temp app (AG-25; workflow artifacts only)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.package_apps }}
        run: MARGIN_APP_VARIANT=temp node scripts/build-local.cjs

      - name: Package the release app (AG-25; workflow artifacts only)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.package_apps }}
        run: MARGIN_APP_VARIANT=release node scripts/build-local.cjs

      - name: Launch the packaged temp app in a throwaway home (CI only)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.package_apps }}
        run: node scripts/margin/packaged-launch.mjs "$RUNNER_TEMP/margin-package/temp/builder/mac-arm64/temp.app" temp io.github.xbz123.temp "$RUNNER_TEMP/margin-package/temp/launch.json"

      - name: Launch the packaged release app in a throwaway home (CI only)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.package_apps }}
        run: node scripts/margin/packaged-launch.mjs "$RUNNER_TEMP/margin-package/release/builder/mac-arm64/Margin.app" Margin io.github.xbz123.margin "$RUNNER_TEMP/margin-package/release/launch.json"

      - name: Corresponding source bundle (S19-C; private artifact)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.package_apps }}
        run: node scripts/margin/source-bundle.mjs "$RUNNER_TEMP/margin-source"

      - name: Upload the temp app
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.package_apps }}
        uses: actions/upload-artifact@v7
        with:
          name: margin-app-temp-${{ github.sha }}
          path: |
            ${{ runner.temp }}/margin-package/temp/*.zip
            ${{ runner.temp }}/margin-package/temp/*.json
            ${{ runner.temp }}/margin-package/temp/*.log
            ${{ runner.temp }}/margin-package/temp/BUILD-INFO.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload the release app
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.package_apps }}
        uses: actions/upload-artifact@v7
        with:
          name: margin-app-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/margin-package/release/*.zip
            ${{ runner.temp }}/margin-package/release/*.json
            ${{ runner.temp }}/margin-package/release/*.log
            ${{ runner.temp }}/margin-package/release/BUILD-INFO.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload the source bundle
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.package_apps }}
        uses: actions/upload-artifact@v7
        with:
          name: margin-source-${{ github.sha }}
          path: ${{ runner.temp }}/margin-source/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Inventory a formed temp app (CI diagnostic only; always not accepted)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_inventory }}
        env:
          MARGIN_APP_VARIANT: temp
          MARGIN_PACKAGE_INVENTORY: '1'
        run: node scripts/margin/package-inventory.cjs

      - name: Validate diagnostic upload files are allowlisted text
        id: inventory_texts
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.package_inventory }}
        run: |
          node -e "const fs=require('fs'); const path=require('path'); const dir=path.join(process.env.RUNNER_TEMP,'margin-package-inventory','reports'); if(fs.existsSync(dir)) require('./scripts/margin/package-inventory.cjs').assertTextArtifacts(dir);"

      - name: Upload only diagnostic JSON and logs (never the app or native artifacts)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.package_inventory && steps.inventory_texts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: margin-package-inventory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/margin-package-inventory/reports/inventory.json
            ${{ runner.temp }}/margin-package-inventory/reports/diagnostic-run.json
            ${{ runner.temp }}/margin-package-inventory/reports/build-electron.log
            ${{ runner.temp }}/margin-package-inventory/reports/vite-build.log
            ${{ runner.temp }}/margin-package-inventory/reports/electron-builder.log
          retention-days: 30
          if-no-files-found: warn

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: margin-gates-${{ github.sha }}
          path: ci-evidence/
          retention-days: 30

  libvips:
    if: github.event_name == 'workflow_dispatch' && inputs.libvips_rebuild
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Recipe build tools (as the recipe's own CI installs them)
        run: |
          pipx install meson
          brew install automake nasm
      - name: Rebuild libvips from the fixed recipe, keeping every source
        run: scripts/margin/libvips/rebuild.sh "$RUNNER_TEMP/libvips-out"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: margin-libvips-${{ github.sha }}
          path: |
            ${{ runner.temp }}/libvips-out/*.tar.gz
            ${{ runner.temp }}/libvips-out/build.log
            ${{ runner.temp }}/libvips-out/BUILD-INFO.txt
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: margin-libvips-sources-${{ github.sha }}
          path: ${{ runner.temp }}/libvips-out/sources/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  libvips-replace:
    needs: [gates, libvips]
    if: ${{ !cancelled() && needs.libvips.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.libvips_rebuild && inputs.package_apps }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: margin-app-temp-${{ github.sha }}
          path: ${{ runner.temp }}/app
      - uses: actions/download-artifact@v7
        with:
          name: margin-libvips-${{ github.sha }}
          path: ${{ runner.temp }}/libvips
      - name: Verify both artifacts against their BUILD-INFO
        run: |
          node --input-type=module -e "
            import { verifyDirectory } from './scripts/margin/download-ci-artifact.mjs';
            for (const dir of ['$RUNNER_TEMP/app', '$RUNNER_TEMP/libvips']) console.log(JSON.stringify(verifyDirectory(dir).files));
          "
      - name: Replace libvips in the temp app with the rebuild, re-sign ad hoc and check sharp
        run: |
          set -o pipefail
          ditto -x -k "$RUNNER_TEMP/app/temp-temp-arm64.zip" "$RUNNER_TEMP/unzipped"
          mkdir -p "$RUNNER_TEMP/rebuilt"
          tar -xzf "$RUNNER_TEMP/libvips/sharp-libvips-darwin-arm64v8.tar.gz" -C "$RUNNER_TEMP/rebuilt" lib/libvips-cpp.8.17.3.dylib
          scripts/margin/libvips/replace-check.sh "$RUNNER_TEMP/unzipped/temp.app" "$RUNNER_TEMP/rebuilt/lib/libvips-cpp.8.17.3.dylib" "$RUNNER_TEMP/replace" 2>&1 | tee "$RUNNER_TEMP/replace-check.log"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: margin-libvips-replace-${{ github.sha }}
          path: |
            ${{ runner.temp }}/replace/
            ${{ runner.temp }}/replace-check.log
          retention-days: 30
          if-no-files-found: warn
